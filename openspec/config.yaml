# OpenSpec 项目配置
# 文档: https://github.com/Fission-AI/OpenSpec/blob/main/docs/customization.md

schema: spec-driven

# 项目上下文：注入到所有 artifact（proposal/specs/design/tasks）的生成提示中。
# 语言指令置于顶部（官方 multi-language.md 推荐写法）。
context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写；OpenSpec 的结构性标题（如 ## ADDED Requirements）与
  SHALL/MUST 规范词保持英文（校验依赖它们）。代码、文件路径、命令保持原文。

  # FastapiAdmin (aiyun-base) - 全栈快速开发平台
  技术栈与目录：
  - 后端 backend/：FastAPI + SQLAlchemy + Alembic + Redis + uv（Python>=3.12），入口 main.py，本地端口 8001，Swagger /docs，API 前缀 /api/v1
  - 前端管理台 frontend/web/：Vue3 + Vite + TypeScript + Element Plus + Tailwind4 + Pinia（pnpm，Node>=20），本地端口 5180
  - 移动端 frontend/app/：uni-app（H5/小程序/App 同套代码，有独立 wot-ui 约定）
  - 文档站 frontend/docs/：VitePress，中英双语 src/guide 与 src/en/guide（文档改动需同步两份）
  - 部署 docker/：docker-compose（backend/mysql/nginx/redis）

  常用命令（任务验收用）：
  - 后端（cd backend，用 uv）：uv run pytest；uv run main.py run --env=dev；uv run main.py revision -m "说明"；uv run main.py upgrade --env=dev
  - 前端（cd frontend/web）：pnpm ts:check（vue-tsc，改 TS/Vue 必跑）；pnpm lint；pnpm test（vitest）；pnpm build
  - frontend/app、frontend/docs 各自目录内 pnpm 管理
  - 默认账号 super / admin / user，密码均 123456

  后端约定（backend/app）：
  - 模块结构：app/modules/<模块>/<功能>/，含 controller/service/crud/model/schema + 模块根 plugin.toml；可插拔/示例性质放 app/plugin/（结构相同）
  - 路由统一在 app/api/v1/routers.py 注册；路由类用 OperationLogRoute（自动操作日志）
  - 权限：Security(AuthPermission(["模块:资源:操作"]))，三段式标识前后端一致（如 module_ai:chat:query）
  - 响应：SuccessResponse(data=..., msg=...) + response_model=ResponseSchema[T]；业务错误抛 CustomException；日志用 loguru（占位符 {}）
  - 基建在 app/core/：database、base_crud、base_model、security、permission、dependencies、exceptions、ap_scheduler、sse_manager、middlewares
  - 启动时 scripts/initialize.py 自动迁移并导入 backend/sql/*.json 种子数据（菜单/角色/用户/字典等）
  - 改了 model 必须生成并执行 Alembic 迁移（uv run main.py revision / upgrade），不直接改表
  - 代码生成：backend/templates/{python,ts,vue}/*.jinja2 + generator 模块；生成/修改代码后必须重启后端——动态路由发现（app/core/discover.py）只在启动时执行，不重启新模块不生效且会静默失败

  前端 web 约定（frontend/web/src）：
  - API 层 api/module_x/xxx.ts 与后端模块一一对应；页面 views/module_x/，私有组件放同目录 components/，公共组件命名 FaXxx
  - CRUD 优先复用套件：useTable + FaTable + FaSearchBar、useCrudDialog/useCrudForm + FaDialog、useTableColumns、useImportExport、useConfirm——不要手写 ElTable/ElDialog
  - 权限：按钮级 v-hasPerm="'sys:user:add'"（支持数组）；代码内用 useAuth().hasAuth(...)
  - i18n：文案用 $t('key')，词条同时加 locales/langs/zh.json 与 en.json 两份
  - 路由：静态壳 router/routes.ts；业务路由来自后端菜单（guards→MenuProcessor→RouteRegistry 动态 addRoute），新增页面需在菜单管理配置 route_path/route_name/component_path/keep_alive
  - KeepAlive 与工作栏按组件名匹配：defineOptions({ name }) 必须与菜单 route_name 一致，否则缓存失效
  - 有副作用页面（WebSocket/定时器/全局事件）必须实现 onActivated/onDeactivated 释放资源；WebSocket 守卫覆盖握手期（readyState !== CLOSED 才返回）

  通用约定与已知坑位（规划/实现前注意）：
  - 提交规范：husky + commitlint + git-cz（pnpm commit），type 用 feat/fix/refactor/chore/docs/test
  - 跨端需求（web + 小程序）要同时评估 frontend/web 与 frontend/app 两套代码，API 层各自维护
  - 静态托管：register_frontend 检查与挂载必须用同一个 FRONTEND_DIST_DIR（backend/dist）
  - 模板/脚本勿用 {% for %} + {% set %} 累计布尔标志（Jinja2 for 块作用域隔离），改用过滤器一次性计算
  - 详细工程地图、命令与坑位说明见仓库根 SKILL.md（实现前建议完整阅读）

# 按 artifact 追加规则（只对该 artifact 的生成生效）
rules:
  proposal:
    - 明确指出新增/修改的 capability（spec 路径），并列出跨端影响面（backend / frontend-web / frontend-app / docs / docker）
    - 保持精简（1-2 页），写"为什么"优先于"怎么做"，实现细节留给 design.md
  specs:
    - 规范描述用 SHALL/MUST；场景必须用 4 个井号（####）的 WHEN/THEN 格式，每个需求至少一个场景
    - 只写外部可观察行为，不写具体类名/函数/库选型（那些属于 design.md）
    - 改动现有 capability 时沿用原有 spec 路径，不新建近似名
  design:
    - 数据库结构变更必须给出 Alembic 迁移方案与回滚策略
    - 前后端联动的改动要明确 API 契约（路径、请求/响应、鉴权要求），并注明跨端影响
    - 说明关键取舍（为什么选 X 不选 Y）及风险缓解
  tasks:
    - 任务拆到单次会话可完成，按端（backend/web/app/docs）分组
    - 每个任务必须写明验收方式：后端用 uv run pytest，前端用 pnpm ts:check / pnpm lint / pnpm test 或可观察行为

# apply / archive 操作指引（建议性，不约束 artifact 内容）
operations:
  apply:
    guidance:
      - 开始实现前读仓库根 SKILL.md 对齐工程结构与约定
      - 后端改动运行 cd backend && uv run pytest；前端改动运行 cd frontend/web && pnpm ts:check / pnpm lint / pnpm test
      - 数据库变更生成并应用 Alembic 迁移；新增文案同时维护 zh.json 与 en.json；跨端需求同步评估 frontend/app
      - 完成一个任务勾选一个，遇到阻塞先暂停并说明
  archive:
    guidance:
      - 归档前确认所有任务完成且测试通过
      - 完成摘要保持简洁，列出并入主 spec 的 capability 与 BREAKING 变更

# 不用 GitHub Copilot，显式关闭可避免 openspec init/update 反复询问
githubCopilot:
  cloudAgent: false
